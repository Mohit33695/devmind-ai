version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: devmind_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=devmind
      - POSTGRES_PASSWORD=devmind_pass
      - POSTGRES_DB=devmind_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ../backend:/app
    depends_on:
      - postgres
      - qdrant

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: devmind_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ../frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: devmind_postgres
    environment:
      - POSTGRES_USER=devmind
      - POSTGRES_PASSWORD=devmind_pass
      - POSTGRES_DB=devmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: devmind_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
